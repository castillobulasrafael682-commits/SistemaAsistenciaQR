<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registro de Asistencia Liturgia Altepexi</title>


    <!-- LECTOR QR -->

    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
    </script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f4f7fb,
                    #e8edf5
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }


        /* CONTENEDOR PRINCIPAL */

        .contenedor {

            width: 100%;

            max-width: 520px;

            background: white;

            border-radius: 22px;

            padding: 28px 22px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.12);

            text-align: center;

        }


        /* ENCABEZADO */

        .encabezado {

            margin-bottom: 20px;

        }


        .icono {

            font-size: 42px;

            margin-bottom: 8px;

        }


        h1 {

            margin: 0;

            font-size: 27px;

            line-height: 1.2;

            color: #202936;

        }


        .subtitulo {

            margin-top: 10px;

            margin-bottom: 0;

            color: #697586;

            font-size: 16px;

            line-height: 1.5;

        }


        /* ESTADO DE LA CÁMARA */

        .estado {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            margin-top: 18px;

            padding: 8px 14px;

            border-radius: 30px;

            background: #eef2f7;

            color: #536172;

            font-size: 14px;

            font-weight: bold;

        }


        .punto {

            width: 9px;

            height: 9px;

            border-radius: 50%;

            background: #8b95a3;

        }


        /* ESCÁNER */

        #reader {

            width: 100%;

            margin: 22px auto;

            overflow: hidden;

            border-radius: 18px;

        }


        #reader video {

            width: 100% !important;

            border-radius: 15px;

        }


        /* RESULTADO */

        #resultado {

            margin-top: 20px;

            padding: 20px;

            border-radius: 16px;

            font-size: 16px;

            line-height: 1.6;

            transition: 0.3s;

        }


        /* ESPERANDO */

        .esperando {

            background: #f1f4f8;

            color: #4b5563;

        }


        /* ÉXITO */

        .exito {

            background: #e7f7ed;

            color: #176b3a;

            border: 1px solid #bde5ca;

        }


        /* ERROR */

        .error {

            background: #fdecec;

            color: #9b2525;

            border: 1px solid #f2c4c4;

        }


        /* DUPLICADO */

        .duplicado {

            background: #fff4df;

            color: #8a5a00;

            border: 1px solid #f0d49a;

        }


        /* NOMBRE */

        .dato {

            margin-top: 7px;

            font-size: 20px;

            font-weight: bold;

        }


        /* PIE DE PÁGINA */

        .pie {

            margin-top: 22px;

            padding-top: 16px;

            border-top: 1px solid #e5e7eb;

            color: #7a8492;

            font-size: 13px;

        }


        /* CELULAR */

        @media (max-width: 480px) {

            body {

                padding: 10px;

            }


            .contenedor {

                padding: 22px 15px;

                border-radius: 18px;

            }


            h1 {

                font-size: 23px;

            }


            .subtitulo {

                font-size: 15px;

            }

        }

    </style>

</head>


<body>


    <div class="contenedor">


        <!-- ENCABEZADO -->

        <div class="encabezado">


            <div class="icono">

                ⛪

            </div>


            <h1>

                Registro de Asistencia Litúrgica Altepexi

            </h1>


            <p class="subtitulo">

                Escanea tu código QR para registrar tu asistencia

            </p>


            <div class="estado">

                <span class="punto"></span>

                <span id="textoEstado">

                    Cámara iniciando...

                </span>

            </div>


        </div>


        <!-- ESCÁNER QR -->

        <div id="reader"></div>


        <!-- RESULTADO -->

        <div
            id="resultado"
            class="esperando"
        >

            📷 Esperando código QR...

        </div>


        <!-- PIE -->

        <div class="pie">

            Creado por
            <strong>Ing. Jesus Salazar</strong>

        </div>


    </div>


    <script>


        // =====================================================
        // VARIABLE PARA EVITAR DOBLE ESCANEO INMEDIATO
        // =====================================================

        let procesando = false;



        // =====================================================
        // SONIDO DE CONFIRMACIÓN
        // =====================================================

        function sonidoExito() {

            try {

                const contexto =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();


                const oscilador =
                    contexto.createOscillator();


                const ganancia =
                    contexto.createGain();


                oscilador.connect(
                    ganancia
                );


                ganancia.connect(
                    contexto.destination
                );


                oscilador.frequency.value =
                    880;


                oscilador.type =
                    'sine';


                ganancia.gain.setValueAtTime(
                    0.0001,
                    contexto.currentTime
                );


                ganancia.gain.exponentialRampToValueAtTime(
                    0.25,
                    contexto.currentTime + 0.03
                );


                ganancia.gain.exponentialRampToValueAtTime(
                    0.0001,
                    contexto.currentTime + 0.35
                );


                oscilador.start();


                oscilador.stop(
                    contexto.currentTime + 0.35
                );

            }

            catch (error) {

                console.log(
                    'No se pudo reproducir el sonido'
                );

            }

        }



        // =====================================================
        // OBTENER FECHA Y HORA DE MÉXICO
        // =====================================================

        function obtenerFechaMexico(
            fechaServidor
        ) {

            const fecha =
                new Date(
                    fechaServidor
                );


            const fechaMexico =
                fecha.toLocaleDateString(
                    'es-MX',
                    {

                        timeZone:
                            'America/Mexico_City',

                        day:
                            '2-digit',

                        month:
                            '2-digit',

                        year:
                            'numeric'

                    }
                );


            const horaMexico =
                fecha.toLocaleTimeString(
                    'en-US',
                    {

                        timeZone:
                            'America/Mexico_City',

                        hour:
                            'numeric',

                        minute:
                            '2-digit',

                        hour12:
                            true

                    }
                );


            return {

                fechaMexico,

                horaMexico

            };

        }



        // =====================================================
        // REGISTRAR ASISTENCIA
        // =====================================================

        async function registrarAsistencia(
            qrCodigo
        ) {


            // Evita procesar el mismo QR varias veces
            // mientras se está registrando.

            if (procesando) {

                return;

            }


            procesando = true;


            const resultado =
                document.getElementById(
                    'resultado'
                );


            resultado.className =
                'esperando';


            resultado.innerHTML =
                '⏳ Registrando asistencia...';



            try {


                // =================================================
                // ENVIAR QR AL SERVIDOR
                // =================================================

                const respuesta =
                    await fetch(
                        '/api/asistencia',
                        {

                            method:
                                'POST',

                            headers:
                                {

                                    'Content-Type':
                                        'application/json'

                                },

                            body:
                                JSON.stringify(
                                    {

                                        qr_codigo:
                                            qrCodigo

                                    }
                                )

                        }
                    );



                const datos =
                    await respuesta.json();



                // =================================================
                // ASISTENCIA DUPLICADA
                // =================================================

                if (
                    respuesta.status === 409 &&
                    datos.duplicado
                ) {


                    const horario =
                        obtenerFechaMexico(
                            datos.asistencia.registrado_en
                        );


                    resultado.className =
                        'duplicado';


                    resultado.innerHTML =

                        '⚠️ <strong>ASISTENCIA YA REGISTRADA</strong>' +

                        '<br><br>' +

                        '👤 <strong>Integrante:</strong> ' +

                        datos.integrante.nombre +

                        '<br><br>' +

                        '📅 <strong>Fecha:</strong> ' +

                        horario.fechaMexico +

                        '<br><br>' +

                        '🕐 <strong>Hora:</strong> ' +

                        horario.horaMexico;



                    // Volver a permitir escaneos

                    setTimeout(
                        () => {

                            resultado.className =
                                'esperando';


                            resultado.innerHTML =
                                '📷 Esperando siguiente código QR...';


                            procesando =
                                false;

                        },
                        4000
                    );


                    return;

                }



                // =================================================
                // OTRO ERROR
                // =================================================

                if (!respuesta.ok) {


                    resultado.className =
                        'error';


                    resultado.innerHTML =

                        '❌ ' +

                        (
                            datos.error ||
                            'No se pudo registrar la asistencia'
                        );



                    setTimeout(
                        () => {

                            resultado.className =
                                'esperando';


                            resultado.innerHTML =
                                '📷 Esperando siguiente código QR...';


                            procesando =
                                false;

                        },
                        3000
                    );


                    return;

                }



                // =================================================
                // REGISTRO CORRECTO
                // =================================================

                sonidoExito();


                const horario =
                    obtenerFechaMexico(
                        datos.asistencia.registrado_en
                    );


                resultado.className =
                    'exito';


                resultado.innerHTML =

                    '✅ <strong>ASISTENCIA REGISTRADA</strong>' +

                    '<br><br>' +

                    '👤 <strong>Integrante:</strong> ' +

                    datos.integrante.nombre +

                    '<br><br>' +

                    '📅 <strong>Fecha:</strong> ' +

                    horario.fechaMexico +

                    '<br><br>' +

                    '🕐 <strong>Hora:</strong> ' +

                    horario.horaMexico;



                // =================================================
                // REGRESAR AL ESTADO NORMAL
                // =================================================

                setTimeout(
                    () => {

                        resultado.className =
                            'esperando';


                        resultado.innerHTML =
                            '📷 Esperando siguiente código QR...';


                        procesando =
                            false;

                    },
                    4000
                );



            }

            catch (error) {


                console.error(
                    error
                );


                resultado.className =
                    'error';


                resultado.innerHTML =
                    '❌ No se pudo conectar con el servidor';



                setTimeout(
                    () => {

                        resultado.className =
                            'esperando';


                        resultado.innerHTML =
                            '📷 Esperando siguiente código QR...';


                        procesando =
                            false;

                    },
                    3000
                );

            }

        }



        // =====================================================
        // QR DETECTADO
        // =====================================================

        function qrDetectado(
            decodedText,
            decodedResult
        ) {


            console.log(
                'QR detectado:',
                decodedText
            );


            registrarAsistencia(
                decodedText
            );

        }



        // =====================================================
        // CONFIGURACIÓN DEL ESCÁNER
        // =====================================================

        const scanner =
            new Html5QrcodeScanner(

                'reader',

                {

                    fps:
                        10,

                    qrbox:
                        {

                            width:
                                250,

                            height:
                                250

                        },

                    rememberLastUsedCamera:
                        true,

                    supportedScanTypes:
                        [

                            Html5QrcodeScanType
                                .SCAN_TYPE_CAMERA

                        ]

                },

                false

            );



        // =====================================================
        // INICIAR ESCÁNER
        // =====================================================

        scanner.render(

            qrDetectado,

            (errorMessage) => {

                console.log(
                    'Escáner:',
                    errorMessage
                );

            }

        );



        // =====================================================
        // ESTADO DE CÁMARA
        // =====================================================

        setTimeout(
            () => {


                const textoEstado =
                    document.getElementById(
                        'textoEstado'
                    );


                if (textoEstado) {

                    textoEstado.textContent =
                        'Cámara lista para escanear';

                }


            },
            2500
        );


    </script>


</body>

</html>
