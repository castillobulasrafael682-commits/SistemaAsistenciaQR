<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Control de Asistencia</title>

    <!-- Lector de códigos QR -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .contenedor {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            margin-bottom: 10px;
        }

        #reader {
            width: 100%;
            margin: 20px auto;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            line-height: 1.7;
        }

        .exito {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .esperando {
            background: #e2e3e5;
            color: #383d41;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>📋 Control de Asistencia</h1>

        <p>Escanea el código QR del integrante</p>

        <!-- Aquí aparecerá la cámara -->
        <div id="reader"></div>

        <!-- Resultado -->
        <div id="resultado" class="esperando">
            📷 Esperando código QR...
        </div>

    </div>

    <script>

        let procesando = false;

        async function registrarAsistencia(qrCodigo) {

            if (procesando) {
                return;
            }

            procesando = true;

            const resultado = document.getElementById('resultado');

            resultado.className = 'esperando';
            resultado.innerHTML = '⏳ Registrando asistencia...';

            try {

                const respuesta = await fetch(
                    '/api/asistencia',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({
                            qr_codigo: qrCodigo
                        })
                    }
                );

                const datos = await respuesta.json();

                if (!respuesta.ok) {

                    resultado.className = 'error';

                    resultado.innerHTML =
                        '❌ ' + datos.error;

                    setTimeout(() => {
                        procesando = false;
                    }, 3000);

                    return;
                }

                /*
                 * Convertimos la fecha recibida
                 * a horario de Ciudad de México.
                 */

                const fecha = new Date(
                    datos.asistencia.registrado_en
                );

                const fechaMexico =
                    fecha.toLocaleDateString('es-MX', {
                        timeZone: 'America/Mexico_City',
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric'
                    });

                const horaMexico =
                    fecha.toLocaleTimeString('en-US', {
                        timeZone: 'America/Mexico_City',
                        hour: 'numeric',
                        minute: '2-digit',
                        hour12: true
                    });

                resultado.className = 'exito';

                resultado.innerHTML =
                    '✅ <strong>Asistencia registrada</strong><br><br>' +

                    '👤 <strong>Integrante:</strong><br>' +
                    datos.integrante.nombre +
                    '<br><br>' +

                    '🔢 <strong>Número:</strong><br>' +
                    datos.integrante.numero_integrante +
                    '<br><br>' +

                    '📅 <strong>Fecha:</strong><br>' +
                    fechaMexico +
                    '<br><br>' +

                    '🕐 <strong>Hora:</strong><br>' +
                    horaMexico;

                /*
                 * Esperamos unos segundos antes
                 * de permitir otro escaneo.
                 */

                setTimeout(() => {

                    resultado.className = 'esperando';

                    resultado.innerHTML =
                        '📷 Esperando siguiente código QR...';

                    procesando = false;

                }, 4000);

            } catch (error) {

                console.error(error);

                resultado.className = 'error';

                resultado.innerHTML =
                    '❌ No se pudo conectar con el servidor';

                setTimeout(() => {
                    procesando = false;
                }, 3000);
            }
        }


        /*
         * Cuando se detecta un QR
         */

        function qrDetectado(
            decodedText,
            decodedResult
        ) {

            console.log(
                'QR detectado:',
                decodedText
            );

            registrarAsistencia(decodedText);
        }


        /*
         * Configuración del lector
         */

        const scanner =
            new Html5QrcodeScanner(
                "reader",
                {
                    fps: 10,
                    qrbox: {
                        width: 250,
                        height: 250
                    }
                },
                false
            );


        /*
         * Iniciar lector
         */

        scanner.render(
            qrDetectado
        );

    </script>

</body>

</html>
