<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Registro de Asistencia</title>

    <!-- Lector QR -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

            color: #1e293b;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .contenedor {

            width: 100%;
            max-width: 520px;

            background: #ffffff;

            border-radius: 24px;

            padding: 28px 22px;

            box-shadow:
                0 15px 40px rgba(15, 23, 42, 0.12);

            text-align: center;
        }

        /* ENCABEZADO */

        .encabezado {
            margin-bottom: 20px;
        }

        .icono {
            width: 70px;
            height: 70px;

            margin: 0 auto 12px;

            border-radius: 20px;

            background: #eef2ff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 36px;
        }

        h1 {

            margin: 0;

            font-size: 27px;

            font-weight: 700;

            color: #172554;
        }

        .subtitulo {

            margin: 8px 0 0;

            font-size: 15px;

            color: #64748b;

            line-height: 1.5;
        }

        /* ESTADO DE CÁMARA */

        .estado-camara {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            margin: 18px auto 12px;

            padding: 7px 13px;

            border-radius: 30px;

            background: #f1f5f9;

            color: #475569;

            font-size: 13px;

            font-weight: 600;
        }

        .punto {

            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #94a3b8;
        }

        /* CONTENEDOR DEL ESCÁNER */

        .scanner-contenedor {

            width: 100%;

            overflow: hidden;

            border-radius: 20px;

            background: #0f172a;

            padding: 8px;

            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,0.08);
        }

        #reader {

            width: 100%;
        }

        /*
         * Ajustes visuales de html5-qrcode
         */

        #reader video {

            width: 100% !important;

            border-radius: 14px !important;

            object-fit: cover;
        }

        #reader__scan_region {

            min-height: 280px;
        }

        #reader__dashboard {

            padding: 8px !important;
        }

        #reader__dashboard_section {

            margin: 0 !important;
        }

        #reader button {

            border: none;

            border-radius: 10px;

            padding: 10px 15px;

            background: #2563eb;

            color: white;

            font-weight: 600;

            cursor: pointer;
        }

        #reader select {

            border-radius: 8px;

            padding: 8px;

            margin: 5px;

            max-width: 100%;
        }

        /* MENSAJE */

        #resultado {

            margin-top: 18px;

            padding: 18px;

            border-radius: 16px;

            font-size: 16px;

            line-height: 1.5;

            transition: 0.3s;
        }

        .esperando {

            background: #f1f5f9;

            color: #475569;
        }

        .exito {

            background: #ecfdf5;

            color: #166534;

            border: 1px solid #bbf7d0;
        }

        .error {

            background: #fef2f2;

            color: #991b1b;

            border: 1px solid #fecaca;
        }

        /* TARJETA DEL INTEGRANTE */

        .tarjeta-integrante {

            margin-top: 15px;

            padding: 16px;

            border-radius: 14px;

            background: white;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.05);
        }

        .nombre {

            font-size: 22px;

            font-weight: 700;

            color: #14532d;

            margin-bottom: 8px;
        }

        .dato {

            font-size: 15px;

            color: #475569;

            margin: 5px 0;
        }

        /* PIE */

        .pie {

            margin-top: 20px;

            font-size: 12px;

            color: #94a3b8;
        }

        /* CELULAR */

        @media (max-width: 480px) {

            body {
                padding: 12px;
                align-items: flex-start;
            }

            .contenedor {

                margin-top: 10px;

                padding: 22px 15px;

                border-radius: 20px;
            }

            h1 {
                font-size: 23px;
            }

            .subtitulo {
                font-size: 14px;
            }

            #reader__scan_region {
                min-height: 250px;
            }
        }

    </style>

</head>

<body>

    <main class="contenedor">

        <!-- ENCABEZADO -->

        <div class="encabezado">

            <div class="icono">
                📋
            </div>

            <h1>
                Registro de Asistencia
            </h1>

            <p class="subtitulo">
                Coloca el código QR dentro del recuadro
                para registrar tu asistencia.
            </p>

        </div>


        <!-- ESTADO DE CÁMARA -->

        <div class="estado-camara">

            <span class="punto" id="puntoCamara"></span>

            <span id="estadoCamara">
                Preparando cámara...
            </span>

        </div>


        <!-- ESCÁNER -->

        <div class="scanner-contenedor">

            <div id="reader"></div>

        </div>


        <!-- RESULTADO -->

        <div id="resultado" class="esperando">

            📷 Esperando código QR...

        </div>


        <!-- PIE -->

        <div class="pie">

            Sistema de control de asistencia

        </div>

    </main>


    <script>

        let procesando = false;

        let scanner;


        /*
         * SONIDO DE CONFIRMACIÓN
         */

        function sonidoExito() {

            try {

                const contexto =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();

                const oscilador =
                    contexto.createOscillator();

                const ganancia =
                    contexto.createGain();

                oscilador.connect(ganancia);

                ganancia.connect(
                    contexto.destination
                );

                oscilador.frequency.value = 880;

                ganancia.gain.setValueAtTime(
                    0.15,
                    contexto.currentTime
                );

                ganancia.gain.exponentialRampToValueAtTime(
                    0.001,
                    contexto.currentTime + 0.25
                );

                oscilador.start();

                oscilador.stop(
                    contexto.currentTime + 0.25
                );

            } catch (error) {

                console.log(
                    'No se pudo reproducir sonido'
                );

            }
        }


        /*
         * CAMBIAR ESTADO DE CÁMARA
         */

        function cambiarEstadoCamara(
            texto,
            activa = false
        ) {

            const estado =
                document.getElementById(
                    'estadoCamara'
                );

            const punto =
                document.getElementById(
                    'puntoCamara'
                );

            estado.textContent = texto;

            if (activa) {

                punto.style.background =
                    '#22c55e';

            } else {

                punto.style.background =
                    '#f59e0b';

            }

        }


        /*
         * REGISTRAR ASISTENCIA
         */

        async function registrarAsistencia(
            qrCodigo
        ) {

            if (procesando) {
                return;
            }

            procesando = true;

            const resultado =
                document.getElementById(
                    'resultado'
                );

            resultado.className =
                'esperando';

            resultado.innerHTML =
                '⏳ <strong>Registrando asistencia...</strong>';


            try {

                const respuesta =
                    await fetch(
                        '/api/asistencia',
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body: JSON.stringify({
                                qr_codigo:
                                    qrCodigo
                            })
                        }
                    );


                const datos =
                    await respuesta.json();


                /*
                 * ERROR
                 */

                if (!respuesta.ok) {

                    resultado.className =
                        'error';

                    resultado.innerHTML =
                        '❌ <strong>No se pudo registrar</strong><br><br>' +
                        datos.error;

                    setTimeout(() => {

                        resultado.className =
                            'esperando';

                        resultado.innerHTML =
                            '📷 Esperando siguiente código QR...';

                        procesando = false;

                    }, 3000);

                    return;
                }


                /*
                 * FECHA Y HORA MÉXICO
                 */

                const fecha =
                    new Date(
                        datos.asistencia
                            .registrado_en
                    );


                const fechaMexico =
                    fecha.toLocaleDateString(
                        'es-MX',
                        {
                            timeZone:
                                'America/Mexico_City',

                            day: '2-digit',

                            month: '2-digit',

                            year: 'numeric'
                        }
                    );


                const horaMexico =
                    fecha.toLocaleTimeString(
                        'en-US',
                        {
                            timeZone:
                                'America/Mexico_City',

                            hour: 'numeric',

                            minute: '2-digit',

                            hour12: true
                        }
                    );


                /*
                 * SONIDO
                 */

                sonidoExito();


                /*
                 * MOSTRAR ÉXITO
                 */

                resultado.className =
                    'exito';


                resultado.innerHTML = `

                    <div class="tarjeta-integrante">

                        <div style="font-size:36px;">
                            ✅
                        </div>

                        <div class="nombre">
                            ¡Asistencia registrada!
                        </div>

                        <div class="dato">
                            👤 <strong>Integrante:</strong>
                            ${datos.integrante.nombre}
                        </div>

                        <div class="dato">
                            🔢 <strong>Número:</strong>
                            ${datos.integrante.numero_integrante}
                        </div>

                        <div class="dato">
                            📅 <strong>Fecha:</strong>
                            ${fechaMexico}
                        </div>

                        <div class="dato">
                            🕐 <strong>Hora:</strong>
                            ${horaMexico}
                        </div>

                    </div>

                `;


                /*
                 * PREPARAR SIGUIENTE ESCANEO
                 */

                setTimeout(() => {

                    resultado.className =
                        'esperando';

                    resultado.innerHTML =
                        '📷 <strong>Listo para el siguiente QR</strong>';

                    procesando = false;

                }, 3500);


            } catch (error) {

                console.error(error);

                resultado.className =
                    'error';

                resultado.innerHTML =
                    '❌ <strong>Error de conexión</strong><br><br>' +
                    'No se pudo conectar con el servidor.';


                setTimeout(() => {

                    resultado.className =
                        'esperando';

                    resultado.innerHTML =
                        '📷 Esperando siguiente código QR...';

                    procesando = false;

                }, 3000);

            }

        }


        /*
         * QR DETECTADO
         */

        function qrDetectado(
            decodedText,
            decodedResult
        ) {

            console.log(
                'QR detectado:',
                decodedText
            );

            registrarAsistencia(
                decodedText
            );

        }


        /*
         * CONFIGURACIÓN DEL ESCÁNER
         *
         * facingMode: environment
         * intenta utilizar la cámara trasera.
         */

        const configuracion = {

            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            },

            rememberLastUsedCamera: true,

            supportedScanTypes: [
                Html5QrcodeScanType.SCAN_TYPE_CAMERA
            ]

        };


        /*
         * CREAR ESCÁNER
         */

        scanner =
            new Html5QrcodeScanner(
                'reader',

                configuracion,

                false
            );


        /*
         * INICIAR
         */

        scanner.render(

            qrDetectado,

            function(errorMessage) {

                console.log(
                    'Escáner:',
                    errorMessage
                );

            }

        );


        /*
         * Detectar cuando la cámara
         * comienza a funcionar.
         */

        setTimeout(() => {

            cambiarEstadoCamara(
                'Cámara activa',
                true
            );

        }, 2000);


    </script>

</body>

</html>
